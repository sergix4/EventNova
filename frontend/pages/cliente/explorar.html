<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar eventos · EventNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/panel.css">
  <link rel="stylesheet" href="/css/cliente.css">
</head>
<body class="panel">
  <div class="panel__velo"></div>

  <!-- Barra lateral: la dibuja js/views/componentes/panel.js -->
  <aside class="barra-lateral barra-lateral--cliente" id="barra-lateral"></aside>

  <div class="panel__principal">
    <header class="cabecera-cliente">
      <div class="cabecera-cliente__izq">
        <button type="button" class="boton-menu" data-accion="abrir-menu" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg></button>
        <div>
          <h1 class="cabecera-cliente__titulo">Explorar eventos</h1>
          <p class="cabecera-cliente__subtitulo">Encuentra eventos disponibles y reserva tu próxima experiencia.</p>
        </div>
      </div>
      <div class="cabecera-cliente__der">
        <div class="notificaciones">
          <button type="button" class="boton-icono" data-accion="notificaciones" aria-label="Notificaciones"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="notificaciones__punto"></span></button>
        <div class="notificaciones__panel" hidden></div>
        </div>
        <div class="avatar-cabecera" id="avatar-cabecera" aria-hidden="true"></div>
      </div>
    </header>

    <main class="panel__contenido">
      <section class="panel-filtros" aria-label="Buscar y filtrar eventos">
        <div class="barra-busqueda">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="buscar" placeholder="Buscar por nombre, ciudad, categoría o descripción…" aria-label="Buscar eventos">
          <button type="button" class="barra-busqueda__limpiar" id="limpiar-busqueda" aria-label="Borrar búsqueda" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="fila-filtros">
          <div class="filtro">
            <select id="filtro-pais" aria-label="País"><option value="">País</option><option value="Colombia">Colombia</option><option value="México">México</option><option value="Argentina">Argentina</option></select>
            <span class="filtro__flecha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="filtro">
            <select id="filtro-departamento" aria-label="Departamento"><option value="">Departamento</option><option value="Antioquia">Antioquia</option><option value="Bogotá D.C.">Bogotá D.C.</option><option value="Valle del Cauca">Valle del Cauca</option><option value="Atlántico">Atlántico</option><option value="Bolívar">Bolívar</option></select>
            <span class="filtro__flecha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="filtro">
            <select id="filtro-ciudad" aria-label="Ciudad"><option value="">Ciudad</option><option value="Bogotá">Bogotá</option><option value="Medellín">Medellín</option><option value="Cali">Cali</option><option value="Barranquilla">Barranquilla</option><option value="Cartagena">Cartagena</option></select>
            <span class="filtro__flecha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <div class="filtro">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            <input type="date" id="filtro-fecha" aria-label="Fecha">
          </div>
          <div class="filtro">
            <select id="filtro-estado" aria-label="Estado"><option value="">Estado</option><option value="Programado">Programado</option><option value="En Boletería">En Boletería</option><option value="En Vivo">En Vivo</option></select>
            <span class="filtro__flecha"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <button type="button" class="boton-limpiar" id="limpiar-filtros" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>Limpiar</button>
          <p class="contador-resultados" id="contador"></p>
        </div>
        <div class="pildoras" id="categorias" role="group" aria-label="Categorías">
          <button type="button" class="pildora-categoria" data-categoria="Todos" aria-pressed="true">Todos</button>
          <button type="button" class="pildora-categoria" data-categoria="Festival" aria-pressed="false">Festival</button>
          <button type="button" class="pildora-categoria" data-categoria="Concierto" aria-pressed="false">Concierto</button>
          <button type="button" class="pildora-categoria" data-categoria="Teatro" aria-pressed="false">Teatro</button>
          <button type="button" class="pildora-categoria" data-categoria="Comedia" aria-pressed="false">Comedia</button>
          <button type="button" class="pildora-categoria" data-categoria="Clásica" aria-pressed="false">Clásica</button>
          <button type="button" class="pildora-categoria" data-categoria="Jazz" aria-pressed="false">Jazz</button>
          <button type="button" class="pildora-categoria" data-categoria="Cultural" aria-pressed="false">Cultural</button>
          <button type="button" class="pildora-categoria" data-categoria="Baile" aria-pressed="false">Baile</button>
        </div>
      </section>

      <div class="resultados-cabecera">
        <div class="resultados-cabecera__izq">
          <h2 class="pequeno" id="titulo-resultados">Todos los eventos disponibles</h2>
          <span class="etiqueta-filtros-activos" id="filtros-activos" hidden>Filtros activos</span>
        </div>
        <p class="resultados-cabecera__contador"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg><span id="conteo"></span></p>
      </div>

      <div id="resultados"></div>
      <div class="panel__espaciador"></div>
    </main>
  </div>

  <script type="module" src="/js/controllers/cliente/explorarController.js"></script>
</body>
</html>
