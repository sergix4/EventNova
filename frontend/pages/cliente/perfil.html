<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil · EventNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/panel.css">
  <link rel="stylesheet" href="/css/cliente.css">
</head>
<body class="panel">
  <div class="panel__velo"></div>

  <!-- Barra lateral: la dibuja js/views/componentes/panel.js -->
  <aside class="barra-lateral barra-lateral--cliente" id="barra-lateral"></aside>

  <div class="panel__principal">
    <header class="cabecera-cliente">
      <div class="cabecera-cliente__izq">
        <button type="button" class="boton-menu" data-accion="abrir-menu" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg></button>
        <div>
          <h1 class="cabecera-cliente__titulo">Mi perfil</h1>
          <p class="cabecera-cliente__subtitulo">Gestiona tu información personal y preferencias.</p>
        </div>
      </div>
      <div class="cabecera-cliente__der">
        <div class="notificaciones">
          <button type="button" class="boton-icono" data-accion="notificaciones" aria-label="Notificaciones"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        </div>
        <div class="avatar-cabecera" id="avatar-cabecera" aria-hidden="true"></div>
      </div>
    </header>

    <main class="panel__contenido">
      <!-- La Vista (perfilClienteView.js) dibuja aquí las secciones del perfil -->
      <div class="perfil-cliente" id="perfil"></div>
    </main>
  </div>

  <script type="module" src="/js/controllers/cliente/perfilController.js"></script>
</body>
</html>
