<!DOCTYPE html>
<html lang="es">
<head>

  <div class="panel__principal">
    <header class="cabecera-cliente">

        <nav class="migas" aria-label="Ruta de navegación">
          <a href="/pages/cliente/inicio.html">Inicio</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>

      </div>

        <div class="notificaciones__panel" hidden></div>
        </div>
        <div class="avatar-cabecera" id="avatar-cabecera" aria-hidden="true"></div>
      </div>
    </header>

    <main class="panel__contenido panel__contenido--sin-relleno">
      <!-- La Vista (detalleEventoView.js) dibuja aquí la portada, la información y la tarjeta de reserva -->
      <div id="detalle-evento"></div>

  </div>

  <script type="module" src="/js/controllers/cliente/detalleEventoController.js"></script>
