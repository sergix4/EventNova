<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubicación geográfica · EventNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/panel.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="panel panel--gestion">
  <div class="panel__velo"></div>

  <!-- Barra lateral: la dibuja js/views/componentes/panel.js -->
  <aside class="barra-lateral barra-lateral--gestion" id="barra-lateral"></aside>

  <main class="panel__principal" id="principal">
    <header class="cabecera-gestion">
      <div class="cabecera-gestion__izq">
        <button type="button" class="boton-menu" data-accion="abrir-menu" aria-label="Abrir menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg></button>
        <div>
          <h1 class="cabecera-gestion__titulo">Ubicación geográfica</h1>
          <p class="cabecera-gestion__subtitulo">Administra los países, departamentos y ciudades donde se realizan los eventos.</p>
        </div>
      </div>

    </header>

    <div class="panel__contenido" id="contenido">
      <section class="tarjeta tarjeta--recortada crud" aria-labelledby="titulo-crud">
        <div class="pestanas" role="tablist" aria-label="Niveles de ubicación">
          <button type="button" class="pestana" role="tab" aria-selected="true">Países</button>
          <button type="button" class="pestana" role="tab" aria-selected="false" disabled>Departamentos<span class="etiqueta-pronto">Pronto</span></button>
          <button type="button" class="pestana" role="tab" aria-selected="false" disabled>Ciudades<span class="etiqueta-pronto">Pronto</span></button>
        </div>
        <div class="tarjeta__cuerpo">
          <h2 class="tarjeta__titulo crud__titulo" id="titulo-crud">Países</h2>

          <!-- Formulario: agregar / editar país -->
          <form class="crud__formulario" id="form-pais" novalidate>
            <label for="nombre-pais" class="solo-lector">Nombre del país</label>
            <input type="text" class="entrada" id="nombre-pais" placeholder="Nombre del país" maxlength="100" autocomplete="off">
            <button type="submit" class="boton boton--primario boton--seminegrita" id="boton-guardar">Agregar</button>
            <button type="button" class="boton boton--neutro" id="boton-cancelar" hidden>Cancelar</button>
          </form>

          <p class="crud__error" id="error-pais" role="alert" hidden></p>

          <div class="tabla-contenedor">
            <table class="tabla tabla--crud">
              <thead><tr><th>Nombre</th><th class="crud__acciones">Acciones</th></tr></thead>
              <tbody id="tabla-paises"><tr><td colspan="2" class="tabla__vacia">Cargando países…</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/controllers/admin/ubicacionController.js"></script>
</body>
</html>
